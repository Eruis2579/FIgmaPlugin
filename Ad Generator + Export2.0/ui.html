<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="./css/ui.css">
  <style>
    body {
      background-color: #ffeb3b;
      font-family: sans-serif;
    }

    .settings-panel {
      background-color: #ffeb3b;
      width: 500px;
      /* border-radius: 8px; */
    }

    .settings-panel h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 18px;
      color: #000;
    }

    .setting-group {
      margin-bottom: 7px;
      display: flex;
      align-items: center;
    }

    .setting-group label {
      display: block;
      font-size: 14px;
      /* margin-bottom: 4px; */
      color: #000;
    }

    .setting-group input {
      width: 100%;
      padding: 3px 8px;
      border: none;
      border-radius: 5px;
      background-color: white;
      text-align: center;
      font-weight: bold;
      cursor: default;
    }

    .setting-group select {
      width: 100%;
      padding: 3px 8px;
      border: none;
      border-radius: 5px;
      background-color: white;
      text-align: center;
      font-weight: bold;
      cursor: default;
    }

    .button-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .button-group button {
      background-color: #4e403b;
      color: white;
      padding: 5px 8px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 80px;
    }

    .label {
      display: flex;
      width: 100px;
      margin-right: 10px;
    }

    .content {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .button-group button:hover {
      background-color: #3a2e2a;
    }
  </style>
</head>

<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <div class="content">
    <div class="settings-panel">
      <h2>SETTINGS</h2>
      <div class="setting-group">
        <div class="label">
          <label>Country</label>
        </div>
        <input type="text" value="NO" id="lang" />
      </div>
      <div class="setting-group">
        <div class="label">
          <label>Category</label>
        </div>
        <input type="text" value="TP" id="category" />
      </div>
      <div class="setting-group">
        <div class="label">
          <label>Campaign</label>
        </div>
        <input type="text" value="EVERGREEN" id="campaign" />
      </div>
      <div class="setting-group">
        <div class="label">
          <label>Hook</label>
        </div>
        <input type="text" value="HACK" id="hook" />
      </div>
      <div class="setting-group">
        <div class="label">
          <label>Version</label>
        </div>
        <input type="text" value="1" id="version" />
      </div>
      <div class="setting-group" id="frame">
        <div class="label">
          <label>Frames</label>
        </div>
        <input type="text" value="10" id="frames" />
      </div>
      <div class="setting-group">
        <div class="label">
          <label>Type</label>
        </div>
        <select id="type" onchange="handleTypeChange()">
          <option value="1">AutoPlace Background Picture</option>
          <option value="2">Transparent</option>
        </select>
      </div>
      <div class="button-group">
        <button id="generate">Generate</button>
        <button id="export">Export</button>
        <button id="cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script>
    function handleTypeChange() {
      const selectedType = document.getElementById("type").value;
      const framesGroup = document.getElementById("frame");
      if (selectedType === "2") {
        framesGroup.style.display = "flex";
      } else {
        framesGroup.style.display = "none";
      }
    }
    document.getElementById('generate').onclick = () => {
      const inputData = {
        lang: document.getElementById("lang").value,
        category: document.getElementById("category").value,
        campaign: document.getElementById("campaign").value,
        hook: document.getElementById("hook").value,
        version: document.getElementById("version").value,
        frames: document.getElementById("frames").value,
        type: document.getElementById("type").value,
      }
      parent.postMessage({ pluginMessage: { type: 'generate-ads', data: inputData } }, '*');
    };

    document.getElementById('export').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'export-ads' } }, '*');
    };
    document.getElementById("cancel").onclick = () => {
      parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
    };

    onmessage = async (event) => {
      const { type, files, fileName, message, message2 } = event.data.pluginMessage;
      if (type === "EXPORT_ZIP") {
        const zip = new JSZip();
        for (const file of files) {
          zip.file(file.name, new Uint8Array(file.bytes));
        }

        const blob = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(blob);
        const today = new Date();

        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0'); // Months are zero-indexed
        const day = String(today.getDate()).padStart(2, '0');
        const hours = String(today.getHours()).padStart(2, '0');
        const minutes = String(today.getMinutes()).padStart(2, '0');
        const seconds = String(today.getSeconds()).padStart(2, '0');

        const a = document.createElement("a");
        a.href = url;
        a.download = `${fileName}(${year}${month}${day}${hours}${minutes}${seconds}).zip`;
        a.click();
      }
    };
    handleTypeChange();
  </script>
</body>

</html>
