<!DOCTYPE html>

<html>
<header>
  <link rel="stylesheet" type="text/css" href="./ui.css">
</header>

<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <div class="content" style="display: flex;height: 100%;justify-content: center;align-items: center;">
    <div>
      <div id="status" style="font-size: 2em;color: brown;margin-bottom: 15px;"></div>
      <div id="download" style="font-size: 1em;color: blue;"></div>
    </div>
  </div>
  <script>
    onmessage = async (event) => {
      const { type, files, fileName, message, message2 } = event.data.pluginMessage;
      if (type === "EXPORT_ZIP") {
        const zip = new JSZip();
        for (const file of files) {
          zip.file(file.name, new Uint8Array(file.bytes));
        }

        const blob = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(blob);
        const today = new Date();

        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0'); // Months are zero-indexed
        const day = String(today.getDate()).padStart(2, '0');
        const hours = String(today.getHours()).padStart(2, '0');
        const minutes = String(today.getMinutes()).padStart(2, '0');
        const seconds = String(today.getSeconds()).padStart(2, '0');

        const a = document.createElement("a");
        a.href = url;
        a.download = `${fileName}(${year}${month}${day}${hours}${minutes}${seconds}).zip`;
        a.click();
      }
      if (type === 'done') {
        const statusEl = document.getElementById('status');
        const download = document.getElementById('download');
        statusEl.innerText = message || 'Done!';
        download.innerText = message2 || 'Done!';
      }
    };
  </script>
</body>

</html>
